<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste des Domaines</title>
  <script src="https://cdn.tailwindcss.com"></script> 
  
</head>
<body class="bg-gray-200 flex h-screen">
  <div class="w-full max-w-8xl p-6 bg-gray-200  mx-auto">
  
    <!-- Ligne des Titres -->
    <div class="flex justify-between items-center gap-6 mb-4">
      <h1 class="text-lg font-semibold text-gray-700 flex-1 text-center">Recherche de intitul</h1>
      <h1 class="text-lg font-semibold text-gray-700 flex-1 text-center">Recherche par  platforme</h1>
      <h1 class="text-lg font-semibold text-gray-700 flex-1 text-center">Recherche par Techno</h1>
      <h1 class="text-lg font-semibold text-gray-700 flex-1 text-center">Recherche par domaine</h1>
    </div>
    <!-- Ligne de l'input + Sélecteurs -->
    <div class="flex justify-between items-center gap-6">
      <!-- Champ de recherche -->
      <div class="relative flex-1">
        <input 
          type="text" 
          id="search-input" 
          class="w-full h-12 p-2 border rounded-lg bg-gray-50 text-gray-700 focus:ring-2 focus:ring-blue-400 focus:outline-none" 
          placeholder="Tapez un domaine..."
          autocomplete="off"
        />
        <!-- Liste des suggestions sous l'input (positionnée avec "absolute") -->
        <ul 
          id="suggestions-list" 
          class="absolute left-0 top-full w-full bg-white border rounded-lg shadow-lg max-h-40 overflow-y-auto  mt-1"
        >
          <!-- Les éléments de la liste des suggestions seront ajoutés dynamiquement ici -->
        </ul>  
      </div>
      <!-- Sélecteurs -->
      <button id ="recherche" class="px-6 py-2 bg-[#fbca00]  text-white font-semibold rounded-lg shadow-md 
               hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-400 
               focus:ring-opacity-75 transition-all">
    Rechercher
</button>
      <select id="platforme-list" class="flex-1 h-12 p-2 border rounded-lg bg-gray-50 text-gray-700 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <option value="">Chargement...</option>
      </select>
  
      <select id="Techno-list" class="flex-1 h-12 p-2 border rounded-lg bg-gray-50 text-gray-700 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <option value="">Chargement...</option>
      </select>
  
      <select id="domaine-list" class="flex-1 h-12 p-2 border rounded-lg bg-gray-50 text-gray-700 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        <option value="">Chargement...</option>
      </select>
    </div>
    <div class="mt-40"></div>
    <div id="resultats">
      <div id="pagination" class="mt-4 flex justify-center"></div>

    </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
