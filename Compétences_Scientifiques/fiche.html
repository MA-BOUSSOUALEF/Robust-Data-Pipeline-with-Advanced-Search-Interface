<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Fiches - Impression partielle & Export PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="./css/fiche.css">
  <meta name="author" content="Kritet Ilyas">
</head>

<body class="bg-gray-100 p-6">
  <div id="main-container" class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6 space-y-4">
    <div class="flex items-center justify-between border-b-2 border-blue-700 pb-2 mb-4">
      <h1 class="text-xl font-bold text-gray-800">Gestion des fiches</h1>
      <div class="flex items-center space-x-2">
        <label for="ficheSelect" class="font-semibold text-gray-700">Choisir la fiche :</label>
        <select id="ficheSelect" class="border border-gray-300 rounded-md py-2 px-3 focus:ring-2 focus:ring-blue-600">
          <option value="structure" id="structure">Fiche Structure</option>
          <option value="scientifique" id="scientifique">Fiche Compétences scientifiques</option>
          <option value="technique" id="technique">Fiche Compétences techniques</option>
        </select>
        <button id="printBtn"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Imprimer</button>
        <button id="exportPdfBtn"
          class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300 transition">Exporter PDF</button>
      </div>
    </div>
    <div id="container-principal">
      <!-- FICHE STRUCTURE -->
      <div id="fiche-structure" class="fiche-spacing fiche-section">
        <div id="structure-wrap" class="max-w-5xl mx-auto bg-white shadow-lg rounded-lg p-6">
          <p class="text-center text-gray-500">Chargement des données...</p>
        </div>
      </div>
      <!-- FICHE SCIENTIFIQUE -->
      <div id="fiche-scientifique" class="hidden fiche-spacing fiche-section">
        <div id="sciences-wrap">
          <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6">
            <div class="border-b-4 border-blue-700 pb-2">
              <h1 class="text-2xl font-bold text-gray-900">Fiche compétences scientifiques</h1>
            </div>
          </div>
        </div>
      </div>
      <!-- FICHE TECHNIQUE -->
      <div id="fiche-technique" class="hidden fiche-spacing fiche-section">
        <div id="tech-wrap" class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6">
          <div class="border-b-4 border-blue-700 pb-2">
            <h1 class="text-2xl font-bold text-gray-900">Fiche compétences techniques</h1>
            <p class="text-blue-700 font-semibold">CRBE <span class="text-gray-600"> | Sous-structuration:
                Équipes</span></p>
          </div>
          <p class="mt-4 text-gray-700 leading-relaxed">Exemple de contenu (outils, protocoles, etc.)</p>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/fiche.js"></script>
</body>

</html>
