<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Panorama HCERES - Graphique Dynamique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="./css/panorama.css">
  <meta name="author" content="Kritet Ilyas">
</head>

<body class="bg-gray-100 p-6">
  <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6 space-y-6">
    <div class="border-b-4 border-blue-700 pb-2">
      <h1 class="text-3xl font-bold text-gray-800">Panorama HCERES - Graphique Dynamique</h1>
      <p class="text-blue-700 font-semibold">
        Sélectionnez vos critères d'affichage
        <span class="block text-sm text-gray-600">Niveau HCERES (axe Y) et organisation (légende)</span>
      </p>
    </div>
    <div class="flex flex-wrap gap-4">
      <div>
        <label for="nomenSelect" class="block text-gray-700 font-semibold mb-1">Niveau HCERES :</label>
        <select id="nomenSelect" class="border border-gray-300 rounded p-2">
          <option value="j_hceres_sous_panel">Sous-panel</option>
          <option value="hceres_panel_fr" selected>Panel</option>
          <option value="hceres_domaine_fr">Domaine</option>
        </select>
      </div>
      <div>
        <label for="orgSelect" class="block text-gray-700 font-semibold mb-1">Niveau d'organisation :</label>
        <select id="orgSelect" class="border border-gray-300 rounded p-2">
          <option value="struct_acronyme">Sous-structure</option>
          <option value="struct_poleut">Unité</option>
          <option value="struct_directoire" selected>Directoire</option>
        </select>
      </div>
    </div>
    <div id="chart" class="border border-gray-200 rounded p-4 relative"></div>
  </div>
  <div id="panoramaButton" class="max-w-6xl mx-auto text-center mt-6">
    <a href="panorama.html" class="bg-blue-700 text-white font-semibold py-2 px-4 rounded hover:bg-blue-800">
      Aller à la page Panorama
    </a>
  </div>
  <div id="tooltip" class="tooltip hidden"></div>
  <script src="./js/panorama.js"></script>

</body>

</html>
