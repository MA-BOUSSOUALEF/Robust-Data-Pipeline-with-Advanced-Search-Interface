<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recherche de Compétences</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-gray-50 p-6">
  <!-- Intro text about filters -->
  <div class="max-w-6xl mx-auto mb-6">
    <h1 class="text-3xl font-bold text-[#004A98]">EXPLORER LES COMPÉTENCES SCIENTIFIQUES</h1>
    <p class="text-md text-gray-600">
      Trouvez des compétences scientifiques selon vos filtres :
      <br />
      <strong>Filtres :</strong> les trois niveaux de la nomenclature (Ref_Nomenclature_HCERES) /
      les directoires de l’UT3 (Ref_Directoires).
    </p>
  </div>

  <!-- Main container -->
  <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-6 space-y-4">
    <!-- Reset filters button -->
    <div class="flex items-center space-x-4">
      <button id="reset-filters" class="filter-btn">❌ Supprimer les filtres</button>
    </div>

    <!-- Toggle text vs. semantic search -->
    <div class="flex items-center space-x-4 mt-4">
      <label class="font-semibold">Mode :</label>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="toggle-mode" class="sr-only peer" />
        <div class="w-11 h-6 bg-gray-200 rounded-full peer-checked:bg-blue-600 relative">
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full peer-checked:left-6 transition-all"></div>
        </div>
        <span class="ml-3 text-sm font-medium text-gray-900">Sémantique</span>
      </label>
    </div>

    <!-- Text-based search UI -->
    <div id="text-search">
      <!-- Input + autocomplete -->
      <div class="relative w-full">
        <input type="text" id="competence-text" placeholder="Rechercher une compétence (choisir dans la liste)..."
          class="p-3 border rounded-md w-full focus:ring-2 focus:ring-[#004A98] transition" />
        <!-- Autocomplete container -->
        <div id="autocomplete-list" class="autocomplete hidden"></div>
      </div>

      <!-- Domaine / Panel / Sous-panel -->
      <div class="grid grid-cols-3 gap-4 mt-4">
        <select id="domaine" class="p-3 border rounded-md w-full focus:ring-2 focus:ring-[#004A98] transition"></select>
        <select id="panel" class="p-3 border rounded-md w-full focus:ring-2 focus:ring-[#004A98] transition"></select>
        <select id="sous_panel"
          class="p-3 border rounded-md w-full focus:ring-2 focus:ring-[#004A98] transition"></select>
      </div>
    </div>

    <!-- Semantic search UI -->
    <div id="semantic-search" class="hidden">
      <input type="text" id="competence-semantic" placeholder="Entrez une phrase pour la recherche sémantique..."
        class="p-3 border rounded-md w-full focus:ring-2 focus:ring-[#004A98] transition" />
      <button id="semantic-search-btn"
        class="mt-4 px-6 py-2 bg-[#004A98] text-white font-semibold rounded-md hover:bg-[#002F66] transition">
        Rechercher
      </button>
    </div>

    <!-- Loading indicator -->
    <div id="loading-indicator" class="loading text-center text-gray-500">Chargement...</div>

    <!-- Results container (with pagination) -->
    <div id="results-container" class="mt-6"></div>

    <!-- Pagination Controls -->
    <div id="pagination-controls" class="flex items-center justify-center space-x-4 mt-4 hidden">
      <button id="prev-page-btn" class="filter-btn">Précédent</button>
      <div id="page-info" class="text-gray-700"></div>
      <button id="next-page-btn" class="filter-btn">Suivant</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="./js/index.js"></script>
</body>

</html>
